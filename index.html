<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kamenictví Cihlář | Úvod</title>
  <style>
    :root {
      --slate-900: #182330;
      --slate-800: #243447;
      --slate-700: #334861;
      --slate-600: #4c6480;
      --slate-200: #d5dfe9;
      --slate-100: #eef2f6;
      --blue-accent: #3a6ea5;
      --blue-accent-hover: #2b5480;
      --blue-soft: #a7c7e7;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: var(--slate-100);
      color: var(--slate-900);
      line-height: 1.6;
    }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Hlavička */
    header {
      background-color: var(--slate-900);
      color: var(--white);
      border-bottom: 3px solid var(--blue-accent);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding: 16px 0;
    }

    .logo {
      text-decoration: none;
      color: var(--white);
    }

    .logo-title {
      display: block;
      font-size: 20px;
      font-weight: bold;
    }

    .logo-sub {
      display: block;
      font-size: 13px;
      color: var(--blue-soft);
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      align-items: center;
    }

    nav a {
      color: var(--white);
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    nav a:hover {
      color: var(--blue-soft);
    }

    /* Větší úvodní pole s jemnějším překryvem, aby vynikla fotka image_0.png */
    .hero {
      min-height: 440px;
      display: flex;
      align-items: center;
      background:
        linear-gradient(135deg, rgba(24, 35, 48, 0.48), rgba(51, 72, 97, 0.42)),
        url("image_0.png") center / cover no-repeat;
      color: var(--white);
      padding: 104px 0;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
    }

    .hero-kicker {
      color: var(--blue-soft);
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .hero h1 {
      font-size: 38px;
      line-height: 1.25;
      margin-bottom: 24px;
      max-width: 720px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      display: inline-block;
      padding: 11px 20px;
      background-color: var(--blue-accent);
      color: var(--white);
      text-decoration: none;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      background-color: var(--blue-accent-hover);
    }

    .btn-ghost {
      background-color: rgba(24, 35, 48, 0.35);
      border: 1px solid var(--blue-soft);
      color: var(--white);
    }

    .btn-ghost:hover {
      background-color: rgba(255, 255, 255, 0.14);
    }

    /* Sekce */
    section {
      padding: 56px 0;
    }

    h2 {
      font-size: 26px;
      color: var(--slate-800);
      margin-bottom: 20px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--slate-200);
    }

    .panel {
      background-color: var(--white);
      border: 1px solid var(--slate-200);
      border-left: 4px solid var(--blue-accent);
      border-radius: 4px;
      padding: 24px;
    }

    .panel p + p {
      margin-top: 14px;
    }

    /* Skupiny */
    .groups {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
