<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kamenictví Cihlář | Úvod</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --slate-950: #111924;
      --slate-900: #182330;
      --slate-800: #243447;
      --slate-700: #334861;
      --slate-600: #4c6480;
      --slate-200: #d5dfe9;
      --slate-100: #eef2f6;
      --blue-accent: #3a6ea5;
      --blue-accent-hover: #2b5480;
      --blue-soft: #b5d1ed;
      --white: #ffffff;
      --radius: 10px;
      --shadow-sm: 0 4px 16px rgba(24, 35, 48, 0.06);
      --shadow-md: 0 12px 30px rgba(24, 35, 48, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Space Grotesk", Arial, Helvetica, sans-serif;
      font-weight: 400;
      background-color: var(--slate-100);
      color: var(--slate-900);
      line-height: 1.65;
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Hlavička */
    header {
      background-color: var(--slate-950);
      color: var(--white);
      border-bottom: 1px solid rgba(181, 209, 237, 0.18);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding: 18px 0;
    }

    .logo {
      text-decoration: none;
      color: var(--white);
    }

    .logo-title {
      display: block;
      font-size: 23px;
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    .logo-title strong {
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .logo-sub {
      display: block;
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--blue-soft);
      margin-top: 2px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      align-items: center;
    }

    nav a {
      color: var(--white);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    nav a:hover {
      color: var(--blue-soft);
      border-bottom-color: var(--blue-soft);
      font-weight: 700;
    }

    /* Velký úvodní banner se sníženým krytím pozadí */
    .hero {
      min-height: 78vh;
      display: flex;
      align-items: center;
      background:
        linear-gradient(125deg, rgba(17, 25, 36, 0.34) 0%, rgba(36, 52, 71, 0.20) 55%, rgba(24, 35, 48, 0.30) 100%),
        url("image_0.png") center / cover no-repeat;
      color: var(--white);
      padding: 148px 0;
      border-bottom: 4px solid var(--blue-accent);
    }

    .hero-content {
      max-width: 780px;
    }

    .hero-kicker {
      display: inline-block;
      background-color: rgba(17, 25, 36, 0.48);
      border: 1px solid rgba(181, 209, 237, 0.45);
      color: var(--blue-soft);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 7px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
      backdrop-filter: blur(3px);
    }

    .hero h1 {
      font-size: clamp(34px, 5vw, 54px);
      font-weight: 400;
      line-height: 1.14;
      letter-spacing: -0.02em;
      margin-bottom: 30px;
      text-shadow: 0 3px 18px rgba(0, 0, 0, 0.68);
    }

    .hero h1 strong {
      font-weight: 700;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .btn {
      display: inline-block;
      padding: 13px 26px;
      background-color: var(--blue-accent);
      color: var(--white);
      text-decoration: none;
      border: 1px solid var(--blue-accent);
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .btn:hover {
      background-color: var(--blue-accent-hover);
      border-color: var(--blue-accent-hover);
      transform: translateY(-1px);
    }

    .btn-ghost {
      background-color: rgba(17, 25, 36, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.75);
      color: var(--white);
      font-weight: 500;
      backdrop-filter: blur(4px);
    }

    .btn-ghost:hover {
      background-color: rgba(255, 255, 255, 0.16);
      border-color: var(--white);
    }

    /* Sekce */
    section {
      padding: 72px 0;
    }

      font-size: 3
