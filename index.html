<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kamenictví Cihlář | Zpracování kamene</title>
  <style>
    :root {
      --bg-dark: #1b2838;
      --bg-card: #ffffff;
      --bg-soft: #eef2f6;
      --text-main: #1e293b;
      --text-muted: #526378;
      --text-light: #f4f7fa;
      --accent: #3b6e9c;
      --accent-dark: #2c5478;
      --accent-soft: #9ec3e6;
      --border: #d4dde7;
      --radius: 8px;
      --max-width: 1120px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-soft);
      line-height: 1.6;
    }

    .container {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Horní lišta a navigace */
    header {
      background-color: var(--bg-dark);
      color: var(--text-light);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(158, 195, 230, 0.16);
    }

    .nav-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 72px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: var(--text-light);
    }

    .brand-name {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .brand-sub {
      font-size: 0.8rem;
      color: #b4c6d8;
    }

    nav ul {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 22px;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--text-light);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: var(--accent-soft);
    }

    .btn {
      display: inline-block;
      background-color: var(--accent);
      color: #ffffff;
      text-decoration: none;
      padding: 12px 22px;
      border-radius: var(--radius);
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: var(--accent-dark);
    }

    .btn-outline {
      background-color: transparent;
      border: 1px solid rgba(158, 195, 230, 0.45);
      color: var(--text-light);
    }

    .btn-outline:hover {
      background-color: rgba(158, 195, 230, 0.12);
    }

    /* Úvodní banner */
    .hero {
      background: linear-gradient(135deg, #162230 0%, #283c52 100%);
      color: var(--text-light);
      padding: 84px 0;
      border-bottom: 4px solid var(--accent);
    }

    .hero-badge {
      display: inline-block;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-soft);
      margin-bottom: 14px;
    }

    .hero h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.2;
      max-width: 720px;
      margin-bottom: 18px;
    }

    .hero p {
      max-width: 640px;
      color: #d3e0ec;
      font-size: 1.05rem;
      margin-bottom: 28px;
    }

    .hero-actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    /* Sekce */
    section {
      padding: 68px 0;
    }

    .section-header {
      margin-bottom: 36px;
      max-width: 700px;
    }

    .section-tag {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-dark);
      margin-bottom: 6px;
    }

    .section-header h2 {
      font-size: 1.85rem;
      margin-bottom: 10px;
      color: var(--bg-dark);
    }

    .section-header p {
      color: var(--text-muted);
    }

    /* Rozdělení do skupin (karty) */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 26px;
    }

    .card h3 {
      font-size: 1.25rem;
      margin-bottom: 12px;
      color: var(--bg-dark);
    }

    .card p {
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .card ul {
      padding-left: 18px;
      color: var(--text-main);
    }

    .card li {
      margin-bottom: 6px;
    }

    /* O nás */
    .about-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 5px solid var(--accent);
      border-radius: var(--radius);
      padding: 32px;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 28px;
      align-items: start;
    }

    .about-box p + p {
      margin-top: 14px;
    }

    .highlights {
      background-color: var(--bg-soft);
      padding: 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .highlights h4 {
      margin-bottom: 10px;
      font-size: 1rem;
      color: var(--bg-dark);
    }

    .highlights ul {
      list-style: none;
    }

    .highlights li {
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }

    .highlights li:last-child {
      border-bottom: none;
    }

    /* Fotogalerie (zástupné bloky) */
    .gallery-grid {
      display: grid;
