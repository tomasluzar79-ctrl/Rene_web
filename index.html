<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kamenictví Cihlář | Úvod</title>
  <style>
    :root {
      --bg-dark: #1b2838;
      --bg-card: #ffffff;
      --bg-soft: #eef2f6;
      --text-main: #1e293b;
      --text-muted: #526378;
      --text-light: #f4f7fa;
      --accent: #3b6e9c;
      --accent-dark: #2c5478;
      --accent-soft: #9ec3e6;
      --border: #d4dde7;
      --radius: 8px;
      --max-width: 1120px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-soft);
      line-height: 1.6;
    }

    .container {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 20px;
    }

    header {
      background-color: var(--bg-dark);
      color: var(--text-light);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(158, 195, 230, 0.16);
    }

    .nav-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 72px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: var(--text-light);
    }

    .brand-name {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .brand-sub {
      font-size: 0.85rem;
      color: #b4c6d8;
    }

    nav ul {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 22px;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--text-light);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: var(--accent-soft);
    }

    .btn {
      display: inline-block;
      background-color: var(--accent);
      color: #ffffff;
      text-decoration: none;
      padding: 11px 20px;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.03em;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: var(--accent-dark);
    }

    .btn-outline {
      background-color: transparent;
      border: 1px solid rgba(158, 195, 230, 0.45);
      color: var(--text-light);
    }

    .btn-outline:hover {
      background-color: rgba(158, 195, 230, 0.12);
    }

    .hero {
      background: linear-gradient(135deg, #162230 0%, #283c52 100%);
      color: var(--text-light);
      padding: 80px 0;
      border-bottom: 4px solid var(--accent);
    }

    .hero-top {
      font-size: 1rem;
      color: var(--accent-soft);
      margin-bottom: 12px;
    }

    .hero h1 {
      font-size: clamp(1.9rem, 3.8vw, 2.8rem);
      line-height: 1.2;
      max-width: 720px;
      margin-bottom: 24px;
    }

    .hero-actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    section {
      padding: 64px 0;
    }

    h2 {
      font-size: 1.7rem;
      margin-bottom: 18px;
      color: var(--bg-dark);
    }

    .box {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
    }

    .box p + p {
      margin-top: 14px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }
