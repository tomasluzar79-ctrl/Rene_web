<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kamenictví Cihlář | Úvod</title>
  <style>
    :root {
      --slate-900: #182330;
      --slate-800: #243447;
      --slate-700: #334861;
      --slate-600: #4c6480;
      --slate-200: #d5dfe9;
      --slate-100: #eef2f6;
      --blue-accent: #3a6ea5;
      --blue-accent-hover: #2b5480;
      --blue-soft: #a7c7e7;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: var(--slate-100);
      color: var(--slate-900);
      line-height: 1.6;
    }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Hlavička */
    header {
      background-color: var(--slate-900);
      color: var(--white);
      border-bottom: 3px solid var(--blue-accent);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding: 16px 0;
    }

    .logo {
      text-decoration: none;
      color: var(--white);
    }

    .logo-title {
      display: block;
      font-size: 20px;
      font-weight: bold;
    }

    .logo-sub {
      display: block;
      font-size: 13px;
      color: var(--blue-soft);
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      align-items: center;
    }

    nav a {
      color: var(--white);
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    nav a:hover {
      color: var(--blue-soft);
    }

    /* Úvodní část */
    .hero {
      background:
        linear-gradient(135deg, rgba(24, 35, 48, 0.85), rgba(51, 72, 97, 0.82)),
        url("images/image_0.png") center / cover no-repeat;
      color: var(--white);
      padding: 72px 0;
    }

    .hero-kicker {
      color: var(--blue-soft);
      font-size: 15px;
      margin-bottom: 10px;
    }

    .hero h1 {
      font-size: 36px;
      line-height: 1.25;
      margin-bottom: 24px;
      max-width: 720px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      display: inline-block;
      padding: 11px 20px;
      background-color: var(--blue-accent);
      color: var(--white);
      text-decoration: none;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      background-color: var(--blue-accent-hover);
    }

    .btn-ghost {
      background-color: transparent;
      border: 1px solid var(--blue-soft);
      color: var(--white);
    }

    .btn-ghost:hover {
      background-color: rgba(255, 255, 255, 0.08);
    }

    /* Sekce */
    section {
      padding: 56px 0;
    }

    h2 {
      font-size: 26px;
      color: var(--slate-800);
      margin-bottom: 20px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--slate-200);
    }

    .panel {
      background-color: var(--white);
      border: 1px solid var(--slate-200);
      border-left: 4px solid var(--blue-accent);
      border-radius: 4px;
      padding: 24px;
    }

    .panel p + p {
      margin-top: 14px;
    }

    /* Skupiny */
    .groups {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .group-card {
      background-color: var(--white);
      border: 1px solid var(--slate-200);
      border-top: 4px solid var(--slate-600);
      border-radius: 4px;
      padding: 22px;
    }

    .group-card h3 {
      font-size: 19px;
      color: var(--slate-800);
      margin-bottom: 10px;
    }

    .group-card p {
      color: var(--slate-600);
      font-size: 15px;
    }

    /* Formulář a kontakt */
    .contact-layout {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 24px;
      align-items: start;
    }

    form,
    .contact-box {
      background-color: var(--white);
      border: 1px solid var(--slate-200);
      border-radius: 4px;
      padding: 24px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: var(--slate-800);
      margin-bottom: 5px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #b7c6d6;
      border-radius: 4px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      color: var(--slate-900);
      background-color: var(--white);
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid rgba(58, 110, 165, 0.3);
      border-color: var(--blue-accent);
    }
