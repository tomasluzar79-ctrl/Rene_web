<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kamenictví Cihlář | Úvod</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --slate-950: #111924;
      --slate-900: #182330;
      --slate-800: #243447;
      --slate-700: #334861;
      --slate-600: #4c6480;
      --slate-200: #d5dfe9;
      --slate-100: #eef2f6;
      --blue-accent: #3a6ea5;
      --blue-accent-hover: #2b5480;
      --blue-soft: #b5d1ed;
      --white: #ffffff;
      --radius: 10px;
      --shadow-sm: 0 4px 16px rgba(24, 35, 48, 0.06);
      --shadow-md: 0 12px 30px rgba(24, 35, 48, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Space Grotesk", Arial, Helvetica, sans-serif;
      font-weight: 400;
      background-color: var(--slate-100);
      color: var(--slate-900);
      line-height: 1.65;
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Hlavička */
    header {
      background-color: var(--slate-950);
      color: var(--white);
      border-bottom: 1px solid rgba(181, 209, 237, 0.18);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding: 18px 0;
    }

    .logo {
      text-decoration: none;
      color: var(--white);
    }

    .logo-title {
      display: block;
      font-size: 23px;
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    .logo-title strong {
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .logo-sub {
      display: block;
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--blue-soft);
      margin-top: 2px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      align-items: center;
    }

    nav a {
      color: var(--white);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    nav a:hover {
      color: var(--blue-soft);
      border-bottom-color: var(--blue-soft);
      font-weight: 700;
    }

    /* Úvodní banner */
    .hero {
      min-height: 78vh;
      display: flex;
      align-items: center;
      background:
        linear-gradient(125deg, rgba(17, 25, 36, 0.34) 0%, rgba(36, 52, 71, 0.20) 55%, rgba(24, 35, 48, 0.30) 100%),
        url("image_0.png") center / cover no-repeat;
      color: var(--white);
      padding: 148px 0;
      border-bottom: 4px solid var(--blue-accent);
    }

    .hero-content {
      max-width: 780px;
    }

    .hero-kicker {
      display: inline-block;
      background-color: rgba(17, 25, 36, 0.48);
      border: 1px solid rgba(181, 209, 237, 0.45);
      color: var(--blue-soft);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 7px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
      backdrop-filter: blur(3px);
    }

    .hero h1 {
      font-size: clamp(34px, 5vw, 54px);
      font-weight: 400;
      line-height: 1.14;
      letter-spacing: -0.02em;
      margin-bottom: 30px;
      text-shadow: 0 3px 18px rgba(0, 0, 0, 0.68);
    }

    .hero h1 strong {
      font-weight: 700;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .btn {
      display: inline-block;
      padding: 13px 26px;
      background-color: var(--blue-accent);
      color: var(--white);
      text-decoration: none;
      border: 1px solid var(--blue-accent);
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .btn:hover {
      background-color: var(--blue-accent-hover);
      border-color: var(--blue-accent-hover);
      transform: translateY(-1px);
    }

    .btn-ghost {
      background-color: rgba(17, 25, 36, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.75);
      color: var(--white);
      font-weight: 500;
      backdrop-filter: blur(4px);
    }

    .btn-ghost:hover {
      background-color: rgba(255, 255, 255, 0.16);
      border-color: var(--white);
    }

    /* Sekce */
    section {
      padding: 72px 0;
      scroll-margin-top: 84px;
    }

    h2 {
      font-size: 30px;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--slate-900);
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--slate-200);
    }

    h2 strong {
      font-weight: 700;
    }

    .panel {
      background-color: var(--white);
      border: 1px solid var(--slate-200);
      border-left: 5px solid var(--blue-accent);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: var(--shadow-sm);
      font-size: 16px;
    }

    .panel p + p {
      margin-top: 16px;
    }

    /* Malé bannerové karty skupin */
    .category-banners {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .banner-btn {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: 240px;
      padding: 24px;
      border-radius: var(--radius);
      text-decoration: none;
      color: var(--white);
      overflow: hidden;
      background-color: var(--slate-800);
      border: 1px solid rgba(181, 209, 237, 0.25);
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .banner-btn:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: var(--blue-soft);
    }

    .banner-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.45;
      transition: transform 0.35s ease, opacity 0.25s ease;
    }

    .banner-btn:hover .banner-bg {
      transform: scale(1.04);
      opacity: 0.58;
    }

    .banner-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(17, 25, 36, 0.22) 0%, rgba(17, 25, 36, 0.84) 100%);
    }

    .banner-content {
      position: relative;
      z-index: 2;
    }

    .banner-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--blue-soft);
      margin-bottom: 8px;
    }

    .banner-title {
      display: block;
      font-size: 23px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
    }

    .banner-sub {
      display: block;
      font-size: 14px;
      color: #dbe7f2;
      margin-bottom: 12px;
    }

    .banner-cta {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--white);
      border-bottom: 2px solid var(--blue-accent);
      padding-bottom: 2px;
    }

    /* Detailní sekce kategorií s referenčními fotkami */
    .category-intro {
      background-color: var(--white);
      border: 1px solid var(--slate-200);
      border-left: 5px solid var(--blue-accent);
      border-radius: var(--radius);
      padding: 24px 28px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
      color: var(--slate-800);
    }

    .ref-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .ref-card {
      background-color: var(--white);
      border: 1px solid var(--slate-200);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .ref-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .ref-trigger {
      display: block;
      width: 100%;
      border: none;
      background: none;
      padding: 0;
      text-align: left;
      cursor: pointer;
    }

    .ref-thumb {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
      background-color: var(--slate-200);
    }

    .ref-caption {
      padding: 14px 18px;
      font-size: 14px;
      font-weight: 500;
      color: var(--slate-900);
      border-top: 3px solid var(--slate-700);
    }

    /* Lightbox pro zvětšení fotky */
    .lightbox {
      position: fixed;
      inset: 0;
      background-color: rgba(17, 25, 36, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
    }

    .lightbox.is-open {
      display: flex;
    }

    .lightbox-box {
      position: relative;
      max-width: 920px;
      width: 100%;
      background-color: var(--slate-900);
      border: 1px solid rgba(181, 209, 237, 0.25);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }

    .lightbox-img {
      width: 100%;
      max-height: 75vh;
      object-fit: contain;
      display: block;
      background-color: var(--slate-950);
    }

    .lightbox-caption {
      padding: 16px 22px;
      color: var(--white);
      font-size: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .lightbox-close {
      background-color: var(--blue-accent);
      color: var(--white);
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .lightbox-close:hover {
      background-color: var(--blue-accent-hover);
    }

    /* Formulář a kontakt */
    .contact-layout {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 28px;
      align-items: start;
    }

    form,
    .contact-box {
      background-color: var(--white);
      border: 1px solid var(--slate-200);
      border-radius: var(--radius);
      padding: 30px;
      box-shadow: var(--shadow-sm);
    }

    .field {
      margin-bottom: 16px;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--slate-800);
      margin-bottom: 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #c3d0de;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      color: var(--slate-900);
      background-color: #fbfcfe;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--blue-accent);
      background-color: var(--white);
      box-shadow: 0 0 0 3px rgba(58, 110, 165, 0.18);
    }

      min-height:
