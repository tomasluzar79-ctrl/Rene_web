<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kamenictví Cihlář | Úvod</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --slate-950: #111924;
      --slate-900: #182330;
      --slate-800: #243447;
      --slate-700: #334861;
      --slate-600: #4c6480;
      --slate-200: #d5dfe9;
      --slate-100: #eef2f6;
      --blue-accent: #3a6ea5;
      --blue-accent-hover: #2b5480;
      --blue-soft: #b5d1ed;
      --white: #ffffff;
      --radius: 10px;
      --shadow-sm: 0 4px 16px rgba(24, 35, 48, 0.06);
      --shadow-md: 0 12px 30px rgba(24, 35, 48, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: var(--slate-100);
      color: var(--slate-900);
      line-height: 1.7;
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Hlavička */
    header {
      background-color: rgba(17, 25, 36, 0.96);
      backdrop-filter: blur(8px);
      color: var(--white);
      border-bottom: 1px solid rgba(181, 209, 237, 0.18);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding: 18px 0;
    }

    .logo {
      text-decoration: none;
      color: var(--white);
    }

    .logo-title {
      display: block;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 23px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    .logo-sub {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      color: var(--blue-soft);
      margin-top: 2px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      align-items: center;
    }

    nav a {
      color: var(--white);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
      transition: color 0.2s
